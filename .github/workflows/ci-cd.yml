name: CI Pipeline (Build and Test)

on:
  push:
  pull_request:
    branches: [ main ]

env:
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
  SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: marketdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Create keystore directories
        run: |
          mkdir -p src/main/resources/ssl
          mkdir -p src/main/resources/certificates
      - name: Restore HTTPS keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > src/main/resources/ssl/studentlab.p12
      - name: Restore signing keystore
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > src/main/resources/certificates/signing.jks
      - name: Build
        run: mvn -B clean compile
      - name: Run tests
        env:
          DB_URL: jdbc:postgresql://localhost:5432/marketdb
          DB_USER: postgres
          DB_PASSWORD: postgres
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ACCESS_EXPIRATION: ${{ secrets.JWT_ACCESS_EXPIRATION }}
          JWT_REFRESH_EXPIRATION: ${{ secrets.JWT_REFRESH_EXPIRATION }}
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          SERVER_PORT: 8443
          SECURITY_LOG_LEVEL: INFO
          APP_SECURITY_LOG_LEVEL: DEBUG
        run: mvn -B test -Dspring.profiles.active=ssl -Dtest=!MarketApplicationTests -Dsurefire.failIfNoSpecifiedTests=false
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
      - name: Package
        run: mvn -B package -DskipTests
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: market-app-jar
          path: target/*.jar